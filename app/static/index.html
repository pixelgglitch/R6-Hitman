<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R6 Hitman</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <div>
          <p class="eyebrow">Rainbow Six Hitman</p>
          <h1>R6 Hitman</h1>
          <p class="subtitle">
            Six case files. Six targets. Three requirements each. First kill scores highest, last kill scores
            lowest.
          </p>
        </div>
        <button id="new-game" class="secondary">New case files</button>
      </header>

      <section class="join">
        <div>
          <h2>Join the lobby</h2>
          <p>Enter a codename to begin tracking your hits.</p>
        </div>
        <div class="join-form">
          <input id="player-name" type="text" placeholder="Enter codename" />
          <button id="join">Enter</button>
        </div>
      </section>

      <section class="layout">
        <section>
          <h2>Case files</h2>
          <div id="case-files" class="grid"></div>
        </section>
        <aside>
          <h2>Scoreboard</h2>
          <div id="scoreboard" class="scoreboard"></div>
        </aside>
      </section>
    </main>

    <template id="case-template">
      <article class="case">
        <div class="case-header">
          <h3></h3>
          <span class="status"></span>
        </div>
        <ul class="requirements"></ul>
        <button class="claim">Claim hit</button>
        <div class="kill-order"></div>
      </article>
    </template>

    <script src="/static/app.js"></script>
  </body>
</html>
